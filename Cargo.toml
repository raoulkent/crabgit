[package]
name = "gitcrab"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
git2 = "0.19"
anyhow = "1.0"
dialoguer = "0.11"
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
globset = "0.4"
rayon = "1.8"
dirs = "5.0"
sha2 = "0.10"
walkdir = "2.4"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
